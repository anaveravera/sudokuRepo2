name: Trigger Jenkins Pipeline

on:
  push:
    branches: ["develop", "release", "main"]
  pull_request:
    branches: ["develop", "release", "main"]

jobs:
  quality:
    name: 1) Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Lint
        run: php -l public/index.php && php -l public/health.php

  build_test:
    name: 2) Build + Unit Tests
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Tests
        run: vendor/bin/phpunit

  trigger_jenkins:
    name: 3) Trigger Jenkins Job
    runs-on: ubuntu-latest
    needs: [build_test]
    if: github.event_name == 'push'
    steps:
      - name: Trigger remote Jenkins pipeline
        env:
          JENKINS_URL: ${{ vars.JENKINS_URL }}
          JENKINS_JOB: ${{ vars.JENKINS_JOB }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
          JENKINS_TRIGGER_TOKEN: ${{ secrets.JENKINS_TRIGGER_TOKEN }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$JENKINS_URL" ] || [ -z "$JENKINS_JOB" ] || [ -z "$JENKINS_USER" ] || [ -z "$JENKINS_API_TOKEN" ] || [ -z "$JENKINS_TRIGGER_TOKEN" ]; then
            echo "Faltan vars/secrets de Jenkins. Saltando trigger real."
            exit 0
          fi

          curl -fsS -u "$JENKINS_USER:$JENKINS_API_TOKEN" \
            -X POST "$JENKINS_URL/job/$JENKINS_JOB/buildWithParameters?token=$JENKINS_TRIGGER_TOKEN&BRANCH_NAME=$BRANCH_NAME"

          echo "Trigger enviado a Jenkins para la rama $BRANCH_NAME"
